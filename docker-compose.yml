services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ganadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ganadero}
      POSTGRES_DB: ${POSTGRES_DB:-ganadero}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
